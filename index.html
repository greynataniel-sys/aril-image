<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ARIL IMAGE</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;background:#080b12;color:#fff;
 font-family:Arial,sans-serif;min-height:100vh;
}
header{
 padding:22px;text-align:center;
 border-bottom:1px solid #17243a;
}
h1{color:#38aaff;letter-spacing:4px}
main{max-width:650px;margin:40px auto;padding:20px}
.panel{
 background:#101725;border:1px solid #203653;
 border-radius:18px;padding:24px;
 box-shadow:0 0 30px #087bff18;
}
textarea{
 width:100%;height:130px;padding:15px;
 background:#080e19;color:white;
 border:1px solid #29466b;border-radius:12px;
 font-size:15px;resize:vertical;
}
button{
 width:100%;margin-top:16px;padding:15px;
 background:linear-gradient(90deg,#087bff,#25c7ff);
 border:0;border-radius:12px;color:white;
 font-size:16px;font-weight:bold;
}
.note{color:#91a5c0;font-size:13px;line-height:1.6}
</style>
</head>
<body>
<header>
<h1>ARIL IMAGE</h1>
<p>YOUR IMAGINATION, OUR CREATION.</p>
</header>
<main>
<div class="panel">
<h2>AI Image Generator</h2>
<p class="note">Describe the image you want to create.</p>
<textarea id="prompt" placeholder="Contoh: futuristic city at night, cinematic lighting..."></textarea>
<button onclick="generate()">GENERATE IMAGE</button>
<p class="note" id="status">ARIL IMAGE is ready.</p>
</div>
</main>
<script>
function generate(){
 const prompt=document.getElementById('prompt').value.trim();
 const status=document.getElementById('status');
 if(!prompt){
  status.textContent='Masukkan deskripsi gambar terlebih dahulu.';
  return;
 }
 status.textContent='Tampilan sudah siap. Mesin AI belum dihubungkan.';
}
</script>
</body>
</html>
